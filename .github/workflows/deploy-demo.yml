name: Deploy Demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Pinned, not ubuntu-latest: latest now maps to Ubuntu 26.04, which
    # Playwright 1.58 cannot install browser OS deps for. 24.04 is supported.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # verify.sh runs the strict-CSP / Trusted Types Playwright test; CI must
      # have the browser before it runs.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Every gate lives in ./verify.sh: the audit, the SBOM check, the type
      # check, lint, the build, both unit suites, the strict-CSP browser test and
      # the size check. Locally and here it is the same script, so they cannot drift.
      - name: verify.sh
        run: sh verify.sh

      # Assemble the GitHub Pages site
      - name: Prepare pages content
        run: |
          mkdir -p _site/dist
          cp -r dist/* _site/dist/

          # The page also loads these from /examples/ — copy them into the site root
          cp examples/styles.css examples/demo.js _site/

          # Rewrite index.html: /latest/ -> ./dist/ and /examples/ -> ./ (site root)
          sed -e 's|/latest/|./dist/|g' -e 's|/examples/|./|g' examples/index.html > _site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
