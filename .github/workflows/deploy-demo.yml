name: Deploy Demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Every gate lives in ./verify.sh: the audit, the SBOM check, the type
      # check, lint, the build, both suites and the size check. Locally and
      # here it is the same script, so the two cannot drift apart.
      - name: verify.sh
        run: sh verify.sh

      # Assemble the GitHub Pages site
      - name: Prepare pages content
        run: |
          mkdir -p _site/dist
          cp -r dist/* _site/dist/

          # Rewrite examples/index.html to use relative paths
          sed 's|/latest/|./dist/|g' examples/index.html > _site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
