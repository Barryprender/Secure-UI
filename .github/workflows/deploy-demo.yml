name: Deploy Demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Security audit — fail on high or critical vulnerabilities
      - name: Security audit
        run: npm audit --audit-level=high

      # SBOM freshness — a stale SBOM describes a dependency tree that no longer
      # exists, so this fails rather than warns.
      - name: SBOM check
        run: npm run sbom:check

      # Type check
      - name: Type check
        run: npm run typecheck

      # Lint
      - name: Lint
        run: npm run lint

      # Build BEFORE the tests.
      #
      # The build-artifact suite (tests/build/) skips itself when dist/ is
      # missing. With the build running after the tests, dist/ did not exist yet,
      # so every one of those checks became it.skip and CI reported green while
      # executing zero of them — including the CSP assertion that the bundle
      # contains no <link> stylesheet, and the assertions that
      # SecureBaseComponent is absent from the published exports.
      - name: Build distributable
        run: npm run build

      # Tests with coverage (dist/ now exists, so the build-artifact suite runs)
      - name: Test with coverage
        run: npm run test:coverage

      # Build-artifact assertions, run explicitly so a skip cannot hide here either
      - name: Build artifact checks
        run: npm run test:build

      # Bundle size check
      - name: Bundle size check
        run: npm run size

      # Assemble the GitHub Pages site
      - name: Prepare pages content
        run: |
          mkdir -p _site/dist
          cp -r dist/* _site/dist/

          # Rewrite examples/index.html to use relative paths
          sed 's|/latest/|./dist/|g' examples/index.html > _site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
